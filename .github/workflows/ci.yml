name: SentinelPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bda-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bda-project/requirements*.txt
      - name: Install web and development dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check webapp.py auth_service.py security_store.py anomaly.py tests
      - name: Type and syntax checks
        run: python -m compileall -q index.py config.py webapp.py auth_service.py security_store.py anomaly.py
      - name: Backend tests
        run: pytest -q
      - name: Security scan
        run: |
          bandit -q -r webapp.py auth_service.py security_store.py anomaly.py
          pip-audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard image
        run: docker build -f bda-project/Dockerfile -t sentinelpulse-web bda-project
      - name: Build streaming image
        run: docker build -f bda-project/Dockerfile.stream -t sentinelpulse-stream bda-project
