name: SentinelPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install web and development dependencies
        run: python -m pip install -r requirements-web.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check webapp.py auth_service.py security_store.py anomaly.py tests
      - name: Type and syntax checks
        run: python -m compileall -q webapp.py auth_service.py security_store.py anomaly.py
      - name: Backend tests
        run: pytest -q
      - name: Security scan
        run: |
          bandit -q -r webapp.py auth_service.py security_store.py anomaly.py
          pip-audit -r requirements-web.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard image
        run: docker build -f Dockerfile -t sentinelpulse-web .
      - name: Build streaming image
        run: docker build -f Dockerfile.stream -t sentinelpulse-stream .
